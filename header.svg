<svg width="850" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="850" height="400" fill="url(#bgGradient)" rx="15"/>
  
  <!-- Content container -->
  <rect x="50" y="50" width="750" height="300" fill="white" fill-opacity="0.95" rx="12"/>
  
  <!-- Title with emoji -->
  <text x="400" y="120" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#5a67d8" text-anchor="middle">
    Hi, I'm Sarah 👋🏻
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="175" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#4c51bf" text-anchor="middle">
    Senior iOS Engineer crafting exceptional mobile experiences 📱✨
  </text>
  
  <!-- Contact -->
  <text x="400" y="225" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#5a67d8" text-anchor="middle">
    Reach out: sarah@sarahuniverse.com ✉️
  </text>
  
  <!-- Divider line -->
  <line x1="150" y1="260" x2="650" y2="260" stroke="#5a67d8" stroke-width="2" opacity="0.5"/>
  
  <!-- Tagline -->
  <text x="400" y="305" font-family="Arial, sans-serif" font-size="18" font-style="italic" fill="#5a67d8" text-anchor="middle">
    Building mobile experiences that users trust, one commit at a time. 💙
  </text>
</svg>
